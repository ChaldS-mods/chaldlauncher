<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="crystalGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
    <linearGradient id="crystalGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#00d4ff"/>
    </linearGradient>
  </defs>

  <!-- Фон -->
  <rect width="256" height="256" rx="48" fill="url(#bgGrad)"/>

  <!-- Кристалл / Алмаз -->
  <g transform="translate(128, 120)">
    <polygon points="0,70 -45,0 45,0" fill="url(#crystalGrad)" opacity="0.9"/>
    <polygon points="0,-60 -45,0 0,0" fill="url(#crystalGrad2)" opacity="0.7"/>
    <polygon points="0,-60 45,0 0,0" fill="url(#crystalGrad)" opacity="0.8"/>
    <polygon points="0,-50 -16,-16 0,-4" fill="white" opacity="0.15"/>
  </g>

  <!-- Буква C (инициал) -->
  <text x="128" y="225" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="1" fill="#00d4ff" opacity="0.6">
    C
  </text>
</svg>
